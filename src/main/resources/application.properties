spring.application.name=felana-backend

# Profil actif par défaut
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.servlet.context-path=/api

# Derrière le proxy HTTPS (Coolify/Traefik) : lire X-Forwarded-Proto/Host, sinon
# l'appli se croit en HTTP et Swagger annonce une URL http:// (bloquée par le navigateur)
server.forward-headers-strategy=framework

# Sonde de santé (/api/actuator/health) : seul endpoint actuator exposé.
# Elle vérifie la base ; pas le SMTP, sinon chaque sonde ouvrirait une connexion Gmail.
management.endpoints.web.exposure.include=health
management.health.mail.enabled=false

#swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuration de secours pour Render si le profil sous-jacent est lent à charger
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Forcer Hibernate à utiliser PostgreSQL quoi qu'il arrive
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Valeurs par défaut du magasin
# ATTENTION : Spring lit les .properties en ISO-8859-1 (pas UTF-8).
# Tout accent doit être écrit en escape Unicode, sinon il s'affiche en double (mojibake) :
#   app.magasin.nom=Hiba cr\u00e9ation Toamasina   (et non le caractere accentue brut)
